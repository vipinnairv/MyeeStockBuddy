name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # jsdom enables the glossary DOM tests; they skip cleanly without it.
      - run: npm install --no-audit --no-fund
      # index.html must be rebuildable from src/ byte-for-byte.
      - run: node build.js --check
      - run: node tests/run.js
